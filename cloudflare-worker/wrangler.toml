name = "free-study-ai-edge"
main = "aiProxyWorker.js"
compatibility_date = "2024-11-01"

# 🔥 Native Cloudflare Workers AI Binding (Edge GPU)
[ai]
binding = "AI"

# 💓 24/7 Anti-Sleep Cron Trigger (Auto-pings Render every 10 minutes from Cloudflare Edge)
[triggers]
crons = ["*/10 * * * *"]

[vars]
ORIGIN_URL = "https://freestudymaterial.onrender.com"
GROQ_MODEL = "openai/gpt-oss-20b"
GEMINI_MODEL = "gemini-flash-lite-latest"

# Note: Add the following secrets in Cloudflare Dashboard or via CLI:
# wrangler secret put GROQ_API_KEY
# wrangler secret put GEMINI_API_KEY
# wrangler secret put TURSO_CIRCLE_SEARCH_URL
# wrangler secret put TURSO_CIRCLE_SEARCH_AUTH_TOKEN
# wrangler secret put HELP_BOT_TOKEN
# wrangler secret put HELP_CHAT_ID
# wrangler secret put HELP_TOPIC_ACTIVE_ID
