<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      if (window.location.pathname.startsWith('/dist')) {
        window.location.replace('/');
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080c16" />
    <meta name="description" content="Free Study Material — High performance university study notes, engineering blueprints, and cloud lecture archives." />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>Free Study Material — Academic Cloud & Notes Vault</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/favicon.ico" />
  </head>
  <body>
    <div id="root">
      <div id="initial-vault-loader" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#060911;color:#f8fafc;font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;text-align:center;padding:24px;box-sizing:border-box;">
        <div style="width:46px;height:46px;border:3px solid rgba(99,102,241,0.2);border-top:3px solid #6366f1;border-radius:50%;animation:fsm-spin 0.8s linear infinite;margin-bottom:18px;"></div>
        <div style="font-size:1.15rem;font-weight:800;color:#fff;letter-spacing:-0.02em;margin-bottom:6px;">Free Study Material Vault</div>
        <div style="font-size:0.82rem;color:#94a3b8;max-width:320px;line-height:1.5;">Connecting to Academic Cloud &amp; Indian Edge CDN...</div>
        <div id="initial-vault-emergency" style="display:none;margin-top:16px;">
          <button id="initial-vault-emergency-btn" style="background:linear-gradient(135deg, #0284c7 0%, #3b82f6 100%);color:#fff;border:none;border-radius:8px;padding:9px 18px;font-size:0.82rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(2,132,199,0.35);">
            ⚡ Force Refresh Vault &amp; Clear Stale Cache
          </button>
        </div>
      </div>
      <style>
        @keyframes fsm-spin { to { transform: rotate(360deg); } }
      </style>
      <script>
        window.emergencyVaultReset = function() {
          try {
            if ('caches' in window) {
              caches.keys().then(function(names) { names.forEach(function(n) { caches.delete(n); }); });
            }
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) { regs.forEach(function(r) { r.unregister(); }); });
            }
            sessionStorage.clear();
          } catch (_) {}
          window.location.replace('/?fresh=' + Date.now());
        };
        setTimeout(function() {
          var emergencyEl = document.getElementById('initial-vault-emergency');
          if (emergencyEl && document.getElementById('initial-vault-loader')) {
            emergencyEl.style.display = 'block';
            var emergencyBtn = document.getElementById('initial-vault-emergency-btn');
            if (emergencyBtn) {
              emergencyBtn.addEventListener('click', function() {
                if (window.emergencyVaultReset) window.emergencyVaultReset();
              });
            }
          }
        }, 3000);
      </script>
    </div>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
      function cacheAllActiveResources() {
        if (!navigator.serviceWorker || !navigator.serviceWorker.controller || !navigator.onLine) return;
        try {
          const entries = performance.getEntriesByType('resource');
          const urls = entries
            .map(function(e) { return e.name; })
            .filter(function(src) {
              try {
                var u = new URL(src);
                if (u.origin !== window.location.origin) return false;
                if (u.pathname.startsWith('/api/') || u.pathname.startsWith('/ws')) return false;
                // Exclude Vite dev server modules & raw source files
                if (u.pathname.startsWith('/src/') || u.pathname.startsWith('/@') || u.pathname.startsWith('/node_modules/') || u.pathname.endsWith('.jsx') || u.pathname.endsWith('.tsx') || u.searchParams.has('t')) return false;
                return true;
              } catch (_) { return false; }
            });

          Array.from(document.querySelectorAll('link[rel="stylesheet"], script[src]')).forEach(function(el) {
            var s = el.href || el.src;
            if (s && s.startsWith(window.location.origin)) {
              try {
                var u = new URL(s);
                if (!u.pathname.startsWith('/src/') && !u.pathname.startsWith('/@') && !u.pathname.startsWith('/node_modules/') && !u.pathname.endsWith('.jsx') && !u.pathname.endsWith('.tsx')) {
                  urls.push(s);
                }
              } catch (_) {}
            }
          });

          urls.push(window.location.origin + '/');
          urls.push(window.location.origin + '/index.html');
          urls.push(window.location.origin + '/manifest.json');

          navigator.serviceWorker.controller.postMessage({
            type: 'CACHE_APP_SHELL',
            urls: Array.from(new Set(urls))
          });
        } catch (_) {}
      }
      window.cacheAllActiveResources = cacheAllActiveResources;

      if ('serviceWorker' in navigator) {
        var registerSW = function() {
          navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).then(function(reg) {
            console.log('[PWA] Service Worker registered with scope:', reg.scope);
            reg.update().catch(function() {});

            if (reg.waiting) {
              reg.waiting.postMessage({ type: 'SKIP_WAITING' });
            }

            reg.addEventListener('updatefound', function() {
              var newWorker = reg.installing;
              if (newWorker) {
                newWorker.addEventListener('statechange', function() {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('[PWA] New Service Worker installed, activating immediately...');
                    newWorker.postMessage({ type: 'SKIP_WAITING' });
                  }
                });
              }
            });

            // ⏰ Periodic Background Sync (6 AM Exam Pre-fetch)
            if ('periodicSync' in reg) {
              try {
                navigator.permissions.query({ name: 'periodic-background-sync' }).then(function(status) {
                  if (status.state === 'granted') {
                    reg.periodicSync.register('fsm-exam-prefetch', {
                      minInterval: 12 * 60 * 60 * 1000,
                    }).then(function() { console.log('[PWA] ⏰ 6 AM Periodic Pre-fetch active!'); });
                  }
                }).catch(function() {});
              } catch (_) {}
            }

            // Proactively cache all active app shell resources once loaded
            setTimeout(cacheAllActiveResources, 1200);
            window.addEventListener('load', function() {
              setTimeout(cacheAllActiveResources, 1500);
            });
          }).catch(function(err) {
            console.warn('[PWA] Service Worker registration failed:', err);
          });
        };

        if (document.readyState === 'complete' || document.readyState === 'interactive') {
          registerSW();
        } else {
          document.addEventListener('DOMContentLoaded', registerSW);
        }

        navigator.serviceWorker.addEventListener('controllerchange', function() {
          console.log('[PWA] Service Worker updated and claimed controller.');
          setTimeout(cacheAllActiveResources, 500);
        });
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
