services:
  - type: web
    name: freestudymaterial
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node --expose-gc --max-old-space-size=240 src/server.js
    envVars:
      - key: RAM_LIMIT_MB
        value: "450"
      - key: NODE_VERSION
        value: 20.18.0
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://freestudymaterial.pages.dev
      - key: APP_URL
        value: https://freestudymaterial.pages.dev
      - key: BACKEND_CLUSTER_URLS
        value: https://freestudymaterial1.onrender.com,https://freestudymaterial2.onrender.com
      - key: VITE_BACKEND_CLUSTER_URLS
        value: https://freestudymaterial1.onrender.com,https://freestudymaterial2.onrender.com
      - key: CLUSTER_SYNC_SECRET
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-2.5-flash-lite,gemini-flash-latest,gemini-2.0-flash
      - key: CLOUDFLARE_AI_MODELS
        value: "@cf/meta/llama-3.1-8b-instruct,@cf/meta/llama-3.2-1b-instruct"
      - key: NVIDIA_MODEL
        value: nvidia/nemotron-3.5-lightning-30b-a3b
      - key: NVIDIA_VISION_MODEL
        value: nvidia/nemotron-3.5-super-vl-120b-a12b
      - key: GITHUB_MODELS_MODEL
        value: openai/gpt-4o-mini
      - key: OPENROUTER_MODEL
        value: meta-llama/llama-3.3-70b-instruct:free
      - key: OPENROUTER_VISION_MODEL
        value: meta-llama/llama-3.2-11b-vision-instruct:free
      - key: OPENROUTER_MODELS
        value: nvidia/nemotron-3.5-lightning:free,google/gemma-4-31b-it:free,google/gemma-4-26b-a4b-it:free
      - key: DISABLE_KEEP_ALIVE
        value: "false"
      - key: KEEP_ALIVE_INTERVAL_MINUTES
        value: "12"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_STORAGE_CHAT_ID
        sync: false
      - key: TELEGRAM_OTP_BOT_TOKEN
        sync: false
      - key: TELEGRAM_OTP_CHAT_ID
        sync: false
      - key: TELEGRAM_TOPIC_GROUP_ID
        sync: false
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_CHAT_AUDIT_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_AUDIT_ADMIN_ID
        sync: false
      - key: TELEGRAM_CHAT_AUDIT_SUPERGROUP_ID
        sync: false
      - key: TELEGRAM_CHAT_TOPIC_POD_AUDITS
        sync: false
      - key: TELEGRAM_CHAT_TOPIC_MEDIA_VAULT
        sync: false
      - key: TELEGRAM_CHAT_TOPIC_DELETED
        sync: false
      - key: TELEGRAM_CHAT_TOPIC_TAMPER_AUDIT
        sync: false
      - key: TELEGRAM_CHAT_TOPIC_FORENSIC_PURGE
        sync: false
      - key: TELEGRAM_CHAT_TOPIC_PRESENCE
        sync: false
      - key: TELEGRAM_CHAT_TOPIC_PUBLIC_CHAT
        sync: false
      - key: TELEGRAM_CHAT_TOPIC_STEALTH
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: TURSO_CACHE_DATABASE_URL
        sync: false
      - key: TURSO_CACHE_AUTH_TOKEN
        sync: false
      - key: CF_WORKER_URL
        value: https://fsm-edge.jnplotus.workers.dev
      - key: VITE_CF_WORKER_URL
        value: https://fsm-edge.jnplotus.workers.dev
      - key: BREVO_SMTP_HOST
        value: smtp-relay.brevo.com
      - key: BREVO_SMTP_PORT
        value: "587"
      - key: BREVO_SMTP_USER
        sync: false
      - key: BREVO_SMTP_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_EMAIL
        sync: false
      - key: BREVO_FROM_NAME
        value: Free Study Material
      - key: VITE_ADMIN_EMAIL
        sync: false
      - key: HELP_BOT_TOKEN
        sync: false
      - key: HELP_CHAT_ID
        sync: false
      - key: HELP_TOPIC_ACTIVE_ID
        sync: false
      - key: HELP_TOPIC_CLOSED_ID
        sync: false
      - key: AI_SEARCH_TOPIC_ID
        sync: false
      - key: TURSO_HELP_DATABASE_URL
        sync: false
      - key: TURSO_HELP_AUTH_TOKEN
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
