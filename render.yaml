services:
  - type: web
    name: freestudymaterial
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node src/server.js
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://freestudymaterial.onrender.com
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_STORAGE_CHAT_ID
        sync: false
      - key: TELEGRAM_OTP_BOT_TOKEN
        sync: false
      - key: TELEGRAM_OTP_CHAT_ID
        sync: false
      - key: TELEGRAM_TOPIC_GROUP_ID
        sync: false
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_CHAT_AUDIT_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_AUDIT_ADMIN_ID
        sync: false
      - key: TELEGRAM_CHAT_AUDIT_SUPERGROUP_ID
        sync: false
      - key: TELEGRAM_CHAT_TOPIC_POD_AUDITS
        sync: false
      - key: TELEGRAM_CHAT_TOPIC_MEDIA_VAULT
        sync: false
      - key: TELEGRAM_CHAT_TOPIC_DELETED
        sync: false
      - key: TELEGRAM_CHAT_TOPIC_TAMPER_AUDIT
        sync: false
      - key: TELEGRAM_CHAT_TOPIC_FORENSIC_PURGE
        sync: false
      - key: TELEGRAM_CHAT_TOPIC_PRESENCE
        sync: false
      - key: TELEGRAM_CHAT_TOPIC_PUBLIC_CHAT
        sync: false
      - key: TELEGRAM_CHAT_TOPIC_STEALTH
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: TURSO_CACHE_DATABASE_URL
        sync: false
      - key: TURSO_CACHE_AUTH_TOKEN
        sync: false
      - key: CF_WORKER_URL
        sync: false
      - key: VITE_CF_WORKER_URL
        sync: false
      - key: BREVO_SMTP_HOST
        value: smtp-relay.brevo.com
      - key: BREVO_SMTP_PORT
        value: "587"
      - key: BREVO_SMTP_USER
        sync: false
      - key: BREVO_SMTP_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_EMAIL
        sync: false
      - key: BREVO_FROM_NAME
        value: Free Study Material
      - key: VITE_ADMIN_EMAIL
        sync: false
      - key: HELP_BOT_TOKEN
        sync: false
      - key: HELP_CHAT_ID
        sync: false
      - key: HELP_TOPIC_ACTIVE_ID
        value: "6"
      - key: HELP_TOPIC_CLOSED_ID
        value: "7"
      - key: TURSO_HELP_DATABASE_URL
        sync: false
      - key: TURSO_HELP_AUTH_TOKEN
        sync: false
