services:
  - type: web
    name: freestudymaterial
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node src/server.js
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://freestudymaterial.onrender.com

